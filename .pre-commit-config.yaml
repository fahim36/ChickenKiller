# Refuses a commit whose Stack content fails the content check. Install once, from the repo root:
#   uvx pre-commit install
# pre-commit runs `entry` + `args` from the repo root; tests/test_pre_commit_hook.py runs it the same way.
repos:
  - repo: local
    hooks:
      - id: content-check
        name: content check
        entry: uv run --project api content-check
        language: system
        files: ^(content/|api/app/content/)
        pass_filenames: false
        args: [content]
