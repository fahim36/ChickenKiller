# Render Blueprint: Postgres, the API (Docker) and the web app (Node).
# Setup steps are in docs/deploy.md.
databases:
  - name: learning-db
    plan: free
    databaseName: learning
    user: learning
    postgresMajorVersion: "16"

services:
  - type: web
    name: learning-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # The image's start command runs api/release.sh (migrations, then an idempotent import of
    # content/) before the server starts. On a paid plan you can move that into
    # preDeployCommand: ./release.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learning-db
          property: connectionString
      # Sign-in (docs/deploy.md). The Clerk instance's Frontend API URL.
      - key: CLERK_ISSUER
        sync: false
      # The web app's public URL, e.g. https://learning-web-xxxx.onrender.com (no trailing slash).
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # The Admin's email address; comma-separate several.
      - key: ADMIN_EMAILS
        sync: false
      # Grades written answers with Claude (docs/deploy.md#grading-written-answers). Without it
      # the app still runs, but written answers can't be graded until it is set.
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: learning-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The API's public URL, e.g. https://learning-api-xxxx.onrender.com (no trailing slash).
      # Free services can't receive private-network traffic, so this must be the public URL.
      - key: API_URL
        sync: false
      # From the Clerk dashboard's API keys page (docs/deploy.md).
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
