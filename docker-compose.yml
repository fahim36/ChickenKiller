# Local Postgres for development and tests: `docker compose up -d db`.
# Host port 5433 avoids clashing with a Postgres already installed on 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
      POSTGRES_DB: learning
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
