# nginx site for the app on the VPS: /etc/nginx/sites-available/chickenkiller.
#
# HTTPS path: OpenVPN owns tcp/443 and forwards every non-VPN connection to 127.0.0.1:8443
# (`port-share`), where nginx picks this server by SNI. Port 80 only answers Let's Encrypt
# renewals and redirects everything else to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name prep.chickenkiller.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://prep.chickenkiller.com$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name prep.chickenkiller.com;

    ssl_certificate     /etc/letsencrypt/live/prep.chickenkiller.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prep.chickenkiller.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/chickenkiller.access.log;
    error_log  /var/log/nginx/chickenkiller.error.log;

    # Reached as :443 through port-share, so never build redirects naming port 8443.
    absolute_redirect off;
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # All headers are set here: a proxy_set_header inside a location would stop these from
    # being inherited, and the app would see 127.0.0.1:3100 as its host.
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade_ic;

    # The MCP connector (streamable HTTP): long-lived responses, no buffering.
    location /mcp/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_read_timeout 120s;
    }
}

map $http_upgrade $connection_upgrade_ic {
    default upgrade;
    ''      close;
}
