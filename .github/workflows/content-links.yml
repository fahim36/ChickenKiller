name: Content links

# External probes stay separate from ordinary CI and app requests.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["content/**"]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check Material and Question Source links
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ "$EVENT" = pull_request ]; then
            args+=(--changed-since "$BASE")
          fi
          uv run --locked --project api content-link-report content "${args[@]}" --output content-link-results
      - name: Save availability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-link-results
          path: content-link-results/
          if-no-files-found: warn
      - name: Publish readable summary
        if: always()
        run: |
          if [ -f content-link-results/summary.md ]; then
            cat content-link-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
